# Sample Nginx Configuration for Hostinger VPS / Ubuntu
# Save this file to: /etc/nginx/sites-available/claudemining
# Then run: sudo ln -s /etc/nginx/sites-available/claudemining /etc/nginx/sites-enabled/
# And restart: sudo systemctl restart nginx

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your domain

    # Increase max upload size for KYC and payment receipts (up to 20MB)
    client_max_body_size 20M;

    # Reverse proxy all requests to Node.js backend (running on port 5000)
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
